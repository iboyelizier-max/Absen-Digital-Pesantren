    <script>
        // --- DATABASE & STATE MANAGEMENT (FIREBASE FIRESTORE) ---
        const DB_KEY = "pesantren_absensi_db_v1";
        const SESSION_KEY = "pesantren_session_v1";

        const firebaseConfig = {
            apiKey: "AIzaSyC2BX7CPynEo0FUjr8qWhMwm2bBv2k6O68",
            authDomain: "absensi-digital-ppad.firebaseapp.com",
            projectId: "absensi-digital-ppad",
            storageBucket: "absensi-digital-ppad.firebasestorage.app",
            messagingSenderId: "359691557871",
            appId: "1:359691557871:web:18720100c286850103b41a"
        };

        // NOTE: apiKey above is replaced immediately below with the exact project value.
        firebaseConfig.apiKey = "AIzaSyC2BX7CPynEo0FUjr8qWhMwm2bBv2k6O68";

        firebase.initializeApp(firebaseConfig);
        const firebaseAuth = firebase.auth();
        const firestore = firebase.firestore();

        const initialData = { teachers: [], students: [], attendance: [] };
        let cloudDB = JSON.parse(JSON.stringify(initialData));
        let lastSyncedDB = JSON.parse(JSON.stringify(initialData));
        let firebaseReady = false;
        let firebaseListenersAttached = false;

        function cloneDB(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function getDB() {
            return cloudDB;
        }

        function docKey(collectionName, item) {
            if (collectionName === 'teachers') return `${item.phone}__${item.theme}`;
            return item.id;
        }

        function saveLocalCache(data) {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('Cache lokal tidak dapat disimpan:', e);
            }
        }

        async function saveDB(data) {
            cloudDB = data;
            saveLocalCache(data);

            if (!firebaseReady) return;

            try {
                const batch = firestore.batch();
                let operations = 0;
                const collections = ['teachers', 'students', 'attendance'];

                for (const collectionName of collections) {
                    const oldMap = new Map((lastSyncedDB[collectionName] || []).map(item => [docKey(collectionName, item), item]));
                    const newMap = new Map((data[collectionName] || []).map(item => [docKey(collectionName, item), item]));

                    for (const [key, item] of newMap) {
                        const oldItem = oldMap.get(key);
                        if (JSON.stringify(oldItem) !== JSON.stringify(item)) {
                            batch.set(firestore.collection(collectionName).doc(key), item);
                            operations++;
                        }
                    }

                    for (const [key] of oldMap) {
                        if (!newMap.has(key)) {
                            batch.delete(firestore.collection(collectionName).doc(key));
                            operations++;
                        }
                    }
                }

                if (operations > 0) {
                    await batch.commit();
                }
                lastSyncedDB = cloneDB(data);
            } catch (error) {
                console.error('Gagal menyimpan ke Firebase:', error);
                showToast('Data belum tersimpan ke server.', 'error');
            }
        }

        async function loadFirebaseDB() {
            const collections = ['teachers', 'students', 'attendance'];
            const loaded = { teachers: [], students: [], attendance: [] };

            for (const collectionName of collections) {
                const snapshot = await firestore.collection(collectionName).get();
                snapshot.forEach(doc => loaded[collectionName].push(doc.data()));
            }

            const localRaw = localStorage.getItem(DB_KEY);
            let localDB = null;
            try {
                localDB = localRaw ? JSON.parse(localRaw) : null;
            } catch (e) {
                localDB = null;
            }

            const cloudEmpty = loaded.teachers.length === 0 && loaded.students.length === 0 && loaded.attendance.length === 0;
            const localHasData = localDB && (localDB.teachers?.length || localDB.students?.length || localDB.attendance?.length);

            // Hanya pada kondisi database cloud benar-benar kosong, data lokal yang sudah ada
            // boleh dipindahkan sekali ke Firebase agar data lama tidak hilang.
            if (cloudEmpty && localHasData) {
                cloudDB = cloneDB(localDB);
                lastSyncedDB = cloneDB(initialData);
                await saveDB(cloudDB);
                loaded.teachers = cloneDB(cloudDB.teachers);
                loaded.students = cloneDB(cloudDB.students);
                loaded.attendance = cloneDB(cloudDB.attendance);
            }

            cloudDB = loaded;
            lastSyncedDB = cloneDB(loaded);
            saveLocalCache(loaded);
        }

        function attachFirebaseListeners() {
            if (firebaseListenersAttached) return;
            firebaseListenersAttached = true;

            ['teachers', 'students', 'attendance'].forEach(collectionName => {
                firestore.collection(collectionName).onSnapshot(snapshot => {
                    cloudDB[collectionName] = snapshot.docs.map(doc => doc.data());
                    lastSyncedDB = cloneDB(cloudDB);
                    saveLocalCache(cloudDB);
                    if (firebaseReady) render(false);
                }, error => {
                    console.error(`Listener Firebase ${collectionName}:`, error);
                });
            });
        }

        async function initializeFirebase() {
            try {
                await firebaseAuth.signInAnonymously();
                await loadFirebaseDB();
                firebaseReady = true;
                attachFirebaseListeners();
                return true;
            } catch (error) {
                console.error('Firebase initialization gagal:', error);
                const localRaw = localStorage.getItem(DB_KEY);
                try {
                    cloudDB = localRaw ? JSON.parse(localRaw) : cloneDB(initialData);
                } catch (e) {
                    cloudDB = cloneDB(initialData);
                }
                lastSyncedDB = cloneDB(cloudDB);
                showToast('Koneksi database online gagal.', 'error');
                return false;
            }
        }

        // Persistent Session Management
        let currentUser = null; 
        let currentView = 'login'; 
        let selectedPengasuhTheme = 'SOROGAN'; 
        let selectedAsuhanTeacherPhone = null;

        function loadSession() {
            const sessionData = localStorage.getItem(SESSION_KEY);
            if (sessionData) {
                try {
                    const parsed = JSON.parse(sessionData);
                    currentUser = parsed.currentUser;
                    currentView = parsed.currentView;
                    selectedPengasuhTheme = parsed.selectedPengasuhTheme || 'SOROGAN';
                    selectedAsuhanTeacherPhone = parsed.selectedAsuhanTeacherPhone || null;
                } catch(e) {
                    currentUser = null;
                    currentView = 'login';
                }
            }
        }

        function saveSession() {
            if (currentUser) {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    currentUser,
                    currentView,
                    selectedPengasuhTheme,
                    selectedAsuhanTeacherPhone
                }));
            } else {
                localStorage.removeItem(SESSION_KEY);
            }
        }

        // --- TOAST NOTIFICATION ---
        let toastTimeout = null;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');
            
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }
            
            msg.innerText = message;
            icon.className = type === 'success' ? 'fa-solid fa-circle-check text-green-400 text-lg' : 'fa-solid fa-circle-exclamation text-red-400 text-lg';
            
            toast.classList.remove('toast-hidden');
            void toast.offsetWidth;
            toast.classList.remove('translate-x-full');
            
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => {
                    toast.classList.add('toast-hidden');
                }, 300);
            }, 3000);
        }

        // --- RENDER ROUTER & HISTORY API ---
        function changeView(view, pushHistory = true) {
            currentView = view;
            saveSession();
            if (pushHistory) {
                history.pushState({ view, selectedAsuhanTeacherPhone, selectedPengasuhTheme }, "", "");
            }
            render();
        }

        window.addEventListener('popstate', (event) => {
            if (currentUser && currentUser.role === 'guru' && currentView === 'dashboard_guru') {
                window.close();
                return;
            }
            if (event.state && event.state.view) {
                currentView = event.state.view;
                selectedAsuhanTeacherPhone = event.state.selectedAsuhanTeacherPhone || null;
                selectedPengasuhTheme = event.state.selectedPengasuhTheme || 'SOROGAN';
                saveSession();
                render(false);
            } else {
                loadSession();
                render(false);
            }
        });

        function render(pushHistory = true) {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!currentUser) {
                currentView = 'login';
            }

            if (currentView === 'login') {
                app.innerHTML = renderLogin();
            } else if (currentView === 'dashboard_pengasuh') {
                app.innerHTML = renderDashboardPengasuh();
            } else if (currentView === 'detail_pengasuh') {
                app.innerHTML = renderDetailPengasuh();
            } else if (currentView === 'dashboard_guru') {
                app.innerHTML = renderDashboardGuru();
            } else if (currentView === 'data_murid') {
                app.innerHTML = renderDataMurid();
            } else if (currentView === 'absensi') {
                app.innerHTML = renderAbsensi();
            } else if (currentView === 'rekap_guru') {
                app.innerHTML = renderRekapGuru();
            }

            if (pushHistory && history.state?.view !== currentView) {
                history.replaceState({ view: currentView, selectedAsuhanTeacherPhone, selectedPengasuhTheme }, "", "");
            }
        }

        // --- VISUAL ERROR HELPER ---
        function setFieldError(elementId, errorMsg) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.classList.add('border-red-500', 'ring-1', 'ring-red-500');
            el.classList.remove('border-slate-200');
            
            let parent = el.parentElement;
            if (el.parentElement.classList.contains('relative')) {
                parent = el.parentElement.parentElement;
            }
            
            let errEl = parent.querySelector('.error-hint');
            if (!errEl) {
                errEl = document.createElement('p');
                errEl.className = 'error-hint text-[11px] text-red-600 mt-1 font-medium';
                parent.appendChild(errEl);
            }
            errEl.innerText = errorMsg;
        }

        function clearFieldError(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
            el.classList.add('border-slate-200');

            let parent = el.parentElement;
            if (el.parentElement.classList.contains('relative')) {
                parent = el.parentElement.parentElement;
            }
            let errEl = parent.querySelector('.error-hint');
            if (errEl) {
                errEl.remove();
            }
        }

        function clearAllErrors(ids) {
            ids.forEach(id => clearFieldError(id));
        }

        let activeLoginRole = 'guru';
        function switchLoginTab(role) {
            activeLoginRole = role;
            const btnGuru = document.getElementById('tab-btn-guru');
            const btnPengasuh = document.getElementById('tab-btn-pengasuh');
            const btnKajian = document.getElementById('tab-btn-kajian');
            const formGuru = document.getElementById('form-guru');
            const formPengasuh = document.getElementById('form-pengasuh');
            const formKajian = document.getElementById('form-kajian');

            if (role === 'guru') {
                btnGuru.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-white text-emerald-700 shadow-sm";
                btnPengasuh.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all text-slate-600";
                btnKajian.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all text-slate-600";
                formGuru.classList.remove('hidden');
                formPengasuh.classList.add('hidden');
                formKajian.classList.add('hidden');
            } else if (role === 'pengasuh') {
                btnPengasuh.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-white text-blue-700 shadow-sm";
                btnGuru.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all text-slate-600";
                btnKajian.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all text-slate-600";
                formPengasuh.classList.remove('hidden');
                formGuru.classList.add('hidden');
                formKajian.classList.add('hidden');
            } else {
                btnKajian.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-white text-purple-700 shadow-sm";
                btnGuru.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all text-slate-600";

                formKajian.classList.remove('hidden');
                formGuru.classList.add('hidden');
                formPengasuh.classList.add('hidden');
            }
        }

        function handleLoginKajian() {
            const category = document.getElementById('k-category').value;
            let categoryName = 'Kajian Tafsir';
            let themeKey = 'KAJIAN_TAFSIR';
            if (category === 'KAJIAN_IHYA_PAGI') {
                categoryName = 'Kajian Ihya’ Ulumiddin — Pagi';
                themeKey = 'KAJIAN_IHYA_PAGI';
            } else if (category === 'KAJIAN_IHYA_SORE') {
                categoryName = 'Kajian Ihya’ Ulumiddin — Sore';
                themeKey = 'KAJIAN_IHYA_SORE';
            }
            
            currentUser = {
                role: 'guru',
                phone: themeKey,
                name: categoryName,
                code: 'kajian',
                theme: themeKey,
                asuhan: categoryName,
                detailLevel: 'Umum'
            };

        function handleLoginGuru() {
            const phone = document.getElementById('g-phone').value.trim();
            const name = document.getElementById('g-name').value.trim().toUpperCase();
            const code = document.getElementById('g-code').value.trim();
            const theme = document.getElementById('g-theme').value;
            const detailLevel = document.getElementById('g-subfield-select').value;

            clearAllErrors(['g-phone', 'g-name', 'g-code']);

            let hasError = false;
            if (!phone) {
                setFieldError('g-phone', 'Nomor HP wajib diisi');
                hasError = true;
            }
            if (!name) {
                setFieldError('g-name', 'Nama Lengkap wajib diisi');
                hasError = true;
            }
            if (!code) {
                setFieldError('g-code', 'Kode Login wajib diisi');
                hasError = true;
            }

            if (hasError) return;

            if (code !== "011103") {
                setFieldError('g-code', 'Kode Salah');
                return;
            }

            const db = getDB();
            
            const existingPhoneAny = db.teachers.find(t => t.phone === phone);
            if (existingPhoneAny && existingPhoneAny.name !== name) {
                setFieldError('g-phone', 'Nomor HP ini sudah terdaftar dengan nama lain.');
                showToast('Nomor HP ini sudah terdaftar dengan nama lain.', 'error');
                return;
            }

            const existingPhoneRecord = db.teachers.find(t => t.phone === phone && t.theme === theme);
            if (existingPhoneRecord && existingPhoneRecord.name !== name) {
                setFieldError('g-phone', 'Nomor HP ini sudah terdaftar dengan nama lain.');
                showToast('Nomor HP ini sudah terdaftar dengan nama lain.', 'error');
                return;
            }

            let teacher = db.teachers.find(t => t.phone === phone && t.theme === theme);

            if (teacher) {
                if (teacher.name !== name) {
                    setFieldError('g-name', 'Nama tidak sesuai dengan nomor HP yang terdaftar.');
                    showToast('Login ditolak: Nama dan Nomor HP tidak cocok.', 'error');
                    return;
                }
                teacher.detailLevel = detailLevel;
                saveDB(db);
                currentUser = { role: 'guru', ...teacher };
                showToast(`Selamat datang kembali, ${teacher.name}!`);
            } else {
                const newTeacher = {
                    phone: phone,
                    name: name,
                    code: code,
                    theme: theme,
                    asuhan: name,
                    detailLevel: detailLevel
                };
                db.teachers.push(newTeacher);
                saveDB(db);
                currentUser = { role: 'guru', ...newTeacher };
                showToast(`Pendaftaran Berhasil! Akun kategori ${theme} dibuat.`);
            }

            history.pushState(null, "", "");
            changeView('dashboard_guru');
        }

        function handleLoginPengasuh() {
            const code = document.getElementById('p-code').value.trim();
            clearAllErrors(['p-code']);

            if (!code) {
                setFieldError('p-code', 'Kode Pengasuh wajib diisi');
                return;

            currentUser = { role: 'pengasuh', name: 'PENGASUH PESANTREN' };
            showToast("Login Pengasuh Berhasil!");
            changeView('dashboard_pengasuh');

        // --- 4. DOWNLOAD EXCEL ---
        function downloadExcel(phone, theme) {
            const db = getDB();
            const teacher = db.teachers.find(t => t.phone === phone && t.theme === theme);
            const students = db.students.filter(s => s.teacherPhone === phone && s.theme === theme);
            const attendanceLogs = db.attendance.filter(a => a.teacherPhone === phone && a.theme === theme);
            const uniqueDates = [...new Set(attendanceLogs.map(a => a.date))].sort();
            const labelItem = teacher.theme === 'SOROGAN' ? 'Tutor' : teacher.theme === 'JAM_BELAJAR' ? 'Guru' : 'Kajian';
            const detailLabelName = teacher.theme === 'SOROGAN' ? 'Jenjang' : teacher.theme === 'JAM_BELAJAR' ? 'Kelas' : 'Akses';
            const detailVal = teacher.detailLevel || 'Umum';

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `REKAP ABSENSI PESANTREN\r\n`;
            csvContent += `Kategori,${teacher.theme}\r\n`;
            csvContent += `${detailLabelName},${detailVal}\r\n`;
            csvContent += `${labelItem},${teacher.asuhan}\r\n`;

            let headers = ["No", "Nama", ...uniqueDates, "Total A", "Total I", "Total S"];
            csvContent += headers.join(",") + "\r\n";

            students.forEach((s, idx) => {
                let row = [idx + 1, `"${s.name}"`];
                let tA = 0, tI = 0, tS = 0;
                uniqueDates.forEach(date => {
                    const log = attendanceLogs.find(a => a.studentId === s.id && a.date === date);
                    const st = log ? log.status : 'H';
                    if (st === 'A') tA++;
                    if (st === 'I') tI++;
                    if (st === 'S') tS++;
                    row.push(st);
                });
                row.push(tA, tI, tS);
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Rekap_${teacher.theme}_${teacher.asuhan.replace(/\s+/g, '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("File Excel (CSV) berhasil diunduh!");
        }
        // --- HAPUS DATA ABSENSI BERDASARKAN BULAN ---
async function deleteAttendanceByMonth(phone, theme, month) {
    if (!month) {
        showToast("Silakan pilih bulan terlebih dahulu.", "error");
        return;
    }

    const db = getDB();

    // Ambil hanya data absensi milik guru/kajian dan bulan yang dipilih
    const logsToDelete = db.attendance.filter(a =>
        a.teacherPhone === phone &&
        a.theme === theme &&
        typeof a.date === 'string' &&
        a.date.startsWith(month)
    );

    if (logsToDelete.length === 0) {
        showToast("Tidak ada data absensi pada bulan tersebut.", "error");
        return;
    }

    const [year, monthNumber] = month.split('-');

    const monthsIndo = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];

    const monthName = monthsIndo[parseInt(monthNumber, 10) - 1];

    const confirmed = confirm(
        `Apakah Anda yakin ingin menghapus seluruh data absensi pada bulan ${monthName} ${year}?\n\n` +
        `${logsToDelete.length} data absensi akan dihapus dari database Firebase.\n\n` +
        `Data santri dan data guru TIDAK akan dihapus.`
    );

    if (!confirmed) return;

    try {
        // Firestore membatasi maksimal 500 operasi dalam satu batch.
        // Karena itu data dipecah menjadi beberapa batch.
        const chunkSize = 450;

        for (let i = 0; i < logsToDelete.length; i += chunkSize) {
            const chunk = logsToDelete.slice(i, i + chunkSize);
            const batch = firestore.batch();

            chunk.forEach(log => {
                batch.delete(
                    firestore.collection('attendance').doc(log.id)
                );
            });

            await batch.commit();
        }

        // Hapus juga dari data lokal aplikasi
        db.attendance = db.attendance.filter(a =>
            !(
                a.teacherPhone === phone &&
                a.theme === theme &&
                typeof a.date === 'string' &&
                a.date.startsWith(month)
            )
        );

        cloudDB = db;
        lastSyncedDB = cloneDB(db);
        saveLocalCache(db);

        showToast(`Data absensi bulan ${monthName} ${year} berhasil dihapus.`);

        render();

    } catch (error) {
        console.error("Gagal menghapus data absensi bulanan:", error);
        showToast("Gagal menghapus data dari Firebase.", "error");
    }
}

        // --- 5. RESET ASUHAN AMAN ---
        async function confirmResetAsuhan(phone, theme, asuhanName) {
    if (!confirm(`Apakah Anda yakin ingin mereset data pada kategori ${theme}?\n\nSemua data peserta dan absensi untuk kategori ini akan dihapus.`)) {
        return;
    }

    const db = getDB();

    const teachersToDelete = db.teachers.filter(
        t => t.phone === phone && t.theme === theme
    );

    const studentsToDelete = db.students.filter(
        s => s.teacherPhone === phone && s.theme === theme
    );

    const attendanceToDelete = db.attendance.filter(
        a => a.teacherPhone === phone && a.theme === theme
    );

    try {
        // Firestore maksimal 500 operasi dalam satu batch.
        // Menggunakan 450 agar sama dengan mekanisme
        // "Hapus Data Bulan Ini".
        const deleteOperations = [];

        teachersToDelete.forEach(teacher => {
            deleteOperations.push({
                collection: 'teachers',
                id: `${teacher.phone}__${teacher.theme}`
            });
        });

        studentsToDelete.forEach(student => {
            deleteOperations.push({
                collection: 'students',
                id: student.id
            });
        });

        attendanceToDelete.forEach(attendance => {
            deleteOperations.push({
                collection: 'attendance',
                id: attendance.id
            });
        });

        const chunkSize = 450;

        for (let i = 0; i < deleteOperations.length; i += chunkSize) {
            const chunk = deleteOperations.slice(i, i + chunkSize);
            const batch = firestore.batch();

            chunk.forEach(item => {
                batch.delete(
                    firestore.collection(item.collection).doc(item.id)
                );
            });

            await batch.commit();
        }

        // Hapus juga dari data lokal aplikasi
        db.teachers = db.teachers.filter(
            t => !(t.phone === phone && t.theme === theme)
        );

        db.students = db.students.filter(
            s => !(s.teacherPhone === phone && s.theme === theme)
        );

        db.attendance = db.attendance.filter(
            a => !(a.teacherPhone === phone && a.theme === theme)
        );

        cloudDB = db;
        lastSyncedDB = cloneDB(db);
        saveLocalCache(db);

        showToast(`Data (${theme}) berhasil di-reset!`);
        render();

    } catch (error) {
        console.error("Gagal mereset data:", error);
        showToast("Gagal menghapus data dari Firebase.", "error");
    }
}

                const db = getDB();
                db.students = db.students.filter(s => s.id !== id);
                db.attendance = db.attendance.filter(a => a.studentId !== id);
                saveDB(db);
                showToast("Data berhasil dihapus.");
                render();
            }
        }

        // --- 8. HALAMAN ABSENSI HARIAN ---
        function renderAbsensi() {
            const db = getDB();
            const students = db.students.filter(s => s.teacherPhone === currentUser.phone && s.theme === currentUser.theme);
            const today = new Date().toISOString().split('T')[0];
            const selectedDate = window.currentAbsensiDate || today;
            const isKajian = currentUser && (currentUser.theme === 'KAJIAN_TAFSIR' || currentUser.theme === 'KAJIAN_IHYA_PAGI' || currentUser.theme === 'KAJIAN_IHYA_SORE');
            const navBgColor = isKajian ? 'bg-purple-900' : currentUser.theme === 'SOROGAN' ? 'bg-emerald-800' : 'bg-indigo-900';
            const navSubBgColor = isKajian ? 'bg-purple-950' : currentUser.theme === 'SOROGAN' ? 'bg-emerald-900' : 'bg-indigo-950';

            return `
                <div class="${navBgColor} text-white px-6 py-4 shadow-md flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <button onclick="changeView('dashboard_guru')" class="w-10 h-10 ${navSubBgColor} hover:opacity-90 rounded-xl flex items-center justify-center text-sm text-slate-200 transition-all"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="font-bold text-base">Input Absensi Harian</h2>
                            <p class="text-xs text-slate-200">${currentUser.name}</p>
                        </div>
                    </div>
                    <div>
                        <input type="date" id="absensi-date" value="${selectedDate}" onchange="changeAbsensiDate(this.value)" class="${navSubBgColor} border border-white/20 text-white text-xs px-3 py-2 rounded-xl focus:outline-none">
                    </div>
                </div>

                <div class="max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6 flex-grow">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-slate-800">Daftar Kehadiran</h3>
                                <p class="text-xs text-slate-500">Tanggal: <span class="font-semibold text-slate-700">${selectedDate}</span>.</p>
                            </div>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${students.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Belum ada data terdaftar. Silakan tambah data terlebih dahulu.</div>` :
                                students.map((s, idx) => {
                                    const log = db.attendance.find(a => a.studentId === s.id && a.date === selectedDate && a.teacherPhone === currentUser.phone);
                                    const currentStatus = log ? log.status : null;

                                    return `
                                        <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center hover:bg-slate-50 transition-all gap-3">
                                            <div class="flex items-center space-x-3">
                                                <span class="w-8 h-8 bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center font-bold text-xs">${idx + 1}</span>
                                                <div>
                                                    <h4 class="font-bold text-slate-800 text-sm">${s.name}</h4>
                                                </div>
                                            </div>
                                            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                                <button onclick="setAttendance('${s.id}', 'H', '${selectedDate}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'H' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Hadir</button>
                                                <button onclick="setAttendance('${s.id}', 'S', '${selectedDate}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'S' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Sakit</button>
                                                <button onclick="setAttendance('${s.id}', 'I', '${selectedDate}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'I' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Izin</button>
                                                <button onclick="setAttendance('${s.id}', 'A', '${selectedDate}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'A' ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Alpa</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function changeAbsensiDate(date) {
            window.currentAbsensiDate = date;
            render();
        }

        function setAttendance(studentId, status, date) {
            const db = getDB();
            let existingLog = db.attendance.find(a => a.studentId === studentId && a.date === date && a.teacherPhone === currentUser.phone);

            if (existingLog) {
                existingLog.status = status;
            } else {
                db.attendance.push({
                    id: 'att_' + Date.now() + Math.random().toString(36).substring(2, 7),
                    teacherPhone: currentUser.phone,
                    theme: currentUser.theme,
                    studentId: studentId,
                    date: date,
                    status: status
                });
            }

            saveDB(db);
            render();
            showToast(`Absensi diperbarui (${status})`);
        }

        // --- 9. REKAP ABSENSI ---
        function renderRekapGuru() {
            const db = getDB();
            const students = db.students.filter(s => s.teacherPhone === currentUser.phone && s.theme === currentUser.theme);
            const attendanceLogs = db.attendance.filter(a => a.teacherPhone === currentUser.phone && a.theme === currentUser.theme);
            const uniqueDates = [...new Set(attendanceLogs.map(a => a.date))].sort();
            const isKajian = currentUser && (currentUser.theme === 'KAJIAN_TAFSIR' || currentUser.theme === 'KAJIAN_IHYA_PAGI' || currentUser.theme === 'KAJIAN_IHYA_SORE');
            const navBgColor = isKajian ? 'bg-purple-900' : currentUser.theme === 'SOROGAN' ? 'bg-emerald-800' : 'bg-indigo-900';
            const navSubBgColor = isKajian ? 'bg-purple-950' : currentUser.theme === 'SOROGAN' ? 'bg-emerald-900' : 'bg-indigo-950';

            return `
                <div class="${navBgColor} text-white px-6 py-4 shadow-md flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <button onclick="changeView('dashboard_guru')" class="w-10 h-10 ${navSubBgColor} hover:opacity-90 rounded-xl flex items-center justify-center text-sm text-slate-200 transition-all"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="font-bold text-base">Rekap Absensi</h2>
                            <p class="text-xs text-slate-200">${currentUser.name}</p>
                        </div>
                    </div>
                </div>

                <div class="max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6 flex-grow">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
    <h3 class="font-bold text-slate-800">
        <i class="fa-solid fa-table text-emerald-600 mr-2"></i>Tabel Rekap Kehadiran
    </h3>

    <div class="flex flex-wrap items-center gap-2">
        <input
            type="month"
            id="rekap-month-delete"
            value="${new Date().toISOString().slice(0, 7)}"
            class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500"
        >

        <button
            onclick="deleteAttendanceByMonth('${currentUser.phone}', '${currentUser.theme}', document.getElementById('rekap-month-delete').value)"
            class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-semibold rounded-xl transition-all flex items-center space-x-1.5"
        >
            <i class="fa-solid fa-trash-can"></i>
            <span>Hapus Data Bulan Ini</span>
        </button>
    </div>
</div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold">
                                        <th class="p-3 border-r border-slate-200 text-center w-12">No</th>
                                        <th class="p-3 border-r border-slate-200 min-w-[180px]">Nama</th>
                                        ${uniqueDates.map(date => `<th class="p-3 border-r border-slate-200 text-center min-w-[70px]">${date}</th>`).join('')}
                                        <th class="p-3 border-r border-slate-200 text-center bg-red-50 text-red-700">Total A</th>
                                        <th class="p-3 border-r border-slate-200 text-center bg-amber-50 text-amber-700">Total I</th>
                                        <th class="p-3 border-r border-slate-200 text-center bg-blue-50 text-blue-700">Total S</th>
                                        <th class="p-3 text-center bg-slate-100 text-slate-700 w-16">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${students.length === 0 ? `<tr><td colspan="${uniqueDates.length + 6}" class="p-8 text-center text-slate-400">Belum ada data terdaftar.</td></tr>` : 
                                        students.map((s, idx) => {
                                            let totalA = 0, totalI = 0, totalS = 0;
                                            return `
                                                <tr class="hover:bg-slate-50/80">
                                                    <td class="p-3 border-r border-slate-200 text-center font-medium text-slate-500">${idx + 1}</td>
                                                    <td class="p-3 border-r border-slate-200 font-semibold text-slate-800">${s.name}</td>
                                                    ${uniqueDates.map(date => {
                                                        const log = attendanceLogs.find(a => a.studentId === s.id && a.date === date);
                                                        const status = log ? log.status : '-';
                                                        if (status === 'A') totalA++;
                                                        else if (status === 'I') totalI++;
                                                        else if (status === 'S') totalS++;
                                                        else if (status === 'H') {}
                                                        
                                                        let badgeColor = 'text-slate-400 bg-slate-50';
                                                        if (status === 'H') badgeColor = 'text-emerald-600 bg-emerald-50';
                                                        if (status === 'A') badgeColor = 'text-red-600 bg-red-50 font-bold';
                                                        if (status === 'I') badgeColor = 'text-amber-600 bg-amber-50 font-bold';
                                                        if (status === 'S') badgeColor = 'text-blue-600 bg-blue-50 font-bold';

                                                        return `<td class="p-3 border-r border-slate-200 text-center"><span class="px-2 py-1 rounded ${badgeColor}">${status}</span></td>`;
                                                    }).join('')}
                                                    <td class="p-3 border-r border-slate-200 text-center font-bold text-red-600 bg-red-50/50">${totalA}</td>
                                                    <td class="p-3 border-r border-slate-200 text-center font-bold text-amber-600 bg-amber-50/50">${totalI}</td>
                                                    <td class="p-3 border-r border-slate-200 text-center font-bold text-blue-600 bg-blue-50/50">${totalS}</td>
                                                    <td class="p-3 text-center">
                                                        <button onclick="openStudentDetail('${s.id}', '${currentUser.phone}', '${currentUser.theme}')" class="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all" title="Lihat Detail Absensi">
                                                            👁
                                                        </button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- MODAL DETAIL ABSENSI -->
                <div id="student-detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base" id="modal-student-name">Detail Absensi</h3>
                                <p class="text-xs text-slate-500" id="modal-student-meta">Keterangan & Kategori</p>
                            </div>
                            <button onclick="closeStudentDetail()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center font-bold transition-all">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-white">
                            <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Pilih Bulan:</label>
                            <input type="month" id="modal-month-picker" onchange="updateStudentDetailMonth()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="p-5 overflow-y-auto flex-grow">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold">
                                        <th class="p-3 border-r border-slate-200">Hari</th>
                                        <th class="p-3 border-r border-slate-200">Tanggal</th>
                                        <th class="p-3 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-attendance-tbody" class="divide-y divide-slate-100">
                                    <!-- Rendered dynamically -->
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 border-t border-slate-100 bg-slate-50 text-right">
                            <button onclick="closeStudentDetail()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl transition-all shadow-sm">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initial Initialization & Render on Load
        (async function startApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 px-6 py-5 text-center">
                        <div class="w-10 h-10 mx-auto mb-3 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <p class="font-bold text-slate-800 text-sm">Menghubungkan database...</p>
                        <p class="text-xs text-slate-500 mt-1">Mohon tunggu sebentar.</p>
                    </div>
                </div>`;

            await initializeFirebase();
            loadSession();
            render(false);
        })();
    </script>
</body>
</html>
